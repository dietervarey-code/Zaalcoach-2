<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>De Zaalcoach - Mobile</title>
<style>
:root{--bg:#020617;--panel:#0f172a;--panel2:#111827;--line:#334155;--text:#e5e7eb;--muted:#94a3b8;--blue:#38bdf8;--green:#22c55e;--red:#ef4444;--yellow:#facc15;--orange:#fb923c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
body{background:radial-gradient(circle at top left,rgba(56,189,248,.18),transparent 34%),radial-gradient(circle at top right,rgba(34,197,94,.13),transparent 35%),linear-gradient(180deg,#020617,#0f172a 55%,#020617);padding-bottom:92px}
header{position:sticky;top:0;z-index:10;background:rgba(2,6,23,.96);border-bottom:1px solid var(--line);padding:13px 15px;backdrop-filter:blur(10px)}
h1{font-size:23px;margin:0}header p{margin:3px 0 0;color:var(--muted);font-size:12px}main{padding:14px;max-width:760px;margin:0 auto}.card,.item{background:rgba(17,24,39,.95);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:13px;box-shadow:0 12px 26px rgba(0,0,0,.22)}.item{background:#0b1220;border-radius:15px}h2,h3{margin-top:0}.muted{color:var(--muted)}.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--blue)}.yellow{color:var(--yellow)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#0b1220;border:1px solid var(--line);border-radius:15px;padding:12px}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.value{font-size:22px;font-weight:900}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1;min-width:115px}button,input,select{font-family:inherit}button{min-height:45px;border:0;border-radius:13px;background:#253044;color:var(--text);font-weight:800;padding:10px 13px}button:active{transform:scale(.98)}button.primary{background:linear-gradient(135deg,#0284c7,#2563eb)}button.success{background:linear-gradient(135deg,#16a34a,#15803d)}button.warning{background:linear-gradient(135deg,#f59e0b,#b45309)}button.danger{background:linear-gradient(135deg,#dc2626,#991b1b)}button.small{min-height:35px;font-size:12px;padding:7px 10px}button.full{width:100%}input,select{width:100%;min-height:45px;padding:10px;border-radius:12px;border:1px solid var(--line);background:#020617;color:var(--text)}.club{position:relative;overflow:hidden}.club:before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:var(--c)}.dot{display:inline-block;width:13px;height:13px;border-radius:99px;border:1px solid rgba(255,255,255,.3)}.nav{position:fixed;left:0;right:0;bottom:0;display:none;grid-template-columns:repeat(5,1fr);gap:6px;background:rgba(2,6,23,.98);border-top:1px solid var(--line);padding:7px 7px calc(7px + env(safe-area-inset-bottom));z-index:20}.nav button{min-height:54px;font-size:11px;padding:5px 2px;border-radius:14px;background:#111827;color:var(--muted)}.nav button.active{background:#1e293b;color:#fff;border:1px solid var(--blue)}.scorebox{display:grid;grid-template-columns:1fr 90px 1fr;gap:8px;align-items:center}.team{background:#0b1220;border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;min-height:82px}.score{text-align:center;font-size:31px;font-weight:900}.log{background:#020617;border:1px solid var(--line);border-radius:16px;padding:10px;min-height:250px;max-height:430px;overflow:auto;font-family:Courier New,monospace}.line{padding:9px 10px;margin-bottom:6px;border-radius:10px;background:#1e293b;font-size:13px;font-weight:800}.goal{background:linear-gradient(90deg,#16a34a,#0284c7);text-transform:uppercase}.start{text-align:center;padding:28px 0}.start h1{font-size:38px;margin-bottom:6px}@media(min-width:680px){.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}}
</style>

<body>
<header><h1>De Zaalcoach V5 Mobile</h1><p id="topInfo">Mobiele carrièreversie - GitHub Pages proof</p></header>
<main id="app"><div class="start"><h1>De Zaalcoach</h1><p class="muted">Spel wordt geladen...</p></div></main>
<nav class="nav" id="nav"><button id="bHome">🏠<br>Home</button><button id="bMatch">⚽<br>Match</button><button id="bTeam">👥<br>Team</button><button id="bTable">🏟️<br>Stand</button><button id="bMore">☰<br>Meer</button></nav>
<script>
(function(){
'use strict';
var KEY='zaalcoach_v5_save';
var S=null;
var liveTimer=null;
function by(id){return document.getElementById(id)}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function money(n){return '€'+Math.round(n).toLocaleString('nl-BE')}
function uid(){return 'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9)}
function safeGet(){try{return localStorage.getItem(KEY)}catch(e){return null}}
function safeSet(v){try{localStorage.setItem(KEY,v)}catch(e){}}
function safeDel(){try{localStorage.removeItem(KEY)}catch(e){}}
var clubs=[
 {name:'ZVK Varey Lommel',rep:70,budget:39000,fans:1350,c1:'#38bdf8',c2:'#0f172a'},
 {name:'Futsal Hasselt',rep:66,budget:32000,fans:1180,c1:'#ef4444',c2:'#111827'},
 {name:'Indoor Eksel',rep:58,budget:24000,fans:860,c1:'#22c55e',c2:'#052e16'},
 {name:'Genk United',rep:63,budget:29000,fans:1040,c1:'#facc15',c2:'#1e1b4b'},
 {name:'Pannekoeken United',rep:56,budget:22000,fans:780,c1:'#fb923c',c2:'#431407'},
 {name:'Turnhout Tigers',rep:59,budget:24500,fans:850,c1:'#a855f7',c2:'#1e1b4b'},
 {name:'Leuven Five',rep:67,budget:33000,fans:1250,c1:'#14b8a6',c2:'#042f2e'},
 {name:'Kempen Kings',rep:61,budget:26500,fans:930,c1:'#f43f5e',c2:'#1f2937'}
];
var first=['Jens','Tom','Karim','Lars','Samir','Niels','Mohamed','Daan','Bram','Ruben','Yassin','Milan','Diego','Arno','Kobe','Ilias','Tibo','Noah','Seppe','Jonas','Wout','Senne'];
var last=['Peeters','Janssens','El Amrani','Vrancken','Benali','Hermans','Azzouzi','Claes','Maes','Willems','Jacobs','Mertens','Driessen','Smets','Martens'];
var pos=['Keeper','Verdediger','Flank','Pivot'];
function pname(){return pick(first)+' '+pick(last)}
function newStats(){return{apps:0,goals:0,assists:0}}
function player(teamId,position,level){
 var age=rnd(18,35),base=level+rnd(-9,9);
 var p={id:uid(),teamId:teamId,name:pname(),age:age,pos:position,att:clamp(rnd(base-8,base+8),25,96),def:clamp(rnd(base-8,base+8),25,96),tech:clamp(rnd(base-8,base+8),25,96),sta:clamp(rnd(base-8,base+8),25,96),mor:rnd(50,86),injury:0,susp:0,stats:newStats()};
 if(position==='Keeper'){p.def=clamp(p.def+15,25,96);p.att=clamp(p.att-18,25,96)}
 if(position==='Verdediger'){p.def=clamp(p.def+10,25,96)}
 if(position==='Pivot'){p.att=clamp(p.att+12,25,96)}
 var rat=rating(p);p.value=Math.max(1200,Math.round(rat*rat*2.2-(age-24)*120));p.wage=Math.max(120,Math.round(rat*6+rnd(-35,65)));return p;
}
function rating(p){
 if(p.pos==='Keeper')return Math.round(p.def*.52+p.tech*.18+p.sta*.12+p.mor*.18);
 if(p.pos==='Verdediger')return Math.round(p.def*.42+p.tech*.23+p.sta*.18+p.mor*.17);
 if(p.pos==='Pivot')return Math.round(p.att*.45+p.tech*.26+p.sta*.13+p.mor*.16);
 return Math.round(p.att*.31+p.def*.15+p.tech*.34+p.sta*.12+p.mor*.08);
}
function save(){if(S)safeSet(JSON.stringify(S))}
function load(){var raw=safeGet();if(!raw)return false;try{S=JSON.parse(raw);return !!S&&!!S.teams&&!!S.players}catch(e){safeDel();return false}}
function team(){return S.teams.find(function(t){return t.id===S.userTeamId})}
function teamBy(id){return S.teams.find(function(t){return t.id===id})}
function squad(id){return S.players.filter(function(p){return p.teamId===id})}
function freePlayers(){return S.players.filter(function(p){return p.teamId===null})}
function sorted(ps){return ps.slice().sort(function(a,b){return rating(b)-rating(a)})}
function wages(){return squad(S.userTeamId).reduce(function(s,p){return s+p.wage},0)}
function avg(id){var q=squad(id);if(!q.length)return 0;return Math.round(q.reduce(function(s,p){return s+rating(p)},0)/q.length)}
function fill(id,level){['Keeper','Keeper','Verdediger','Verdediger','Flank','Flank','Flank','Pivot','Pivot','Verdediger'].forEach(function(x,i){S.players.push(player(id,x,level-(i>7?4:0)))})}
function newGame(id){
 S={season:1,userTeamId:id,teams:[],players:[],schedule:[],lineup:[],tactic:'Gebalanceerd',ticket:14,inbox:['Welkom manager. Bouw je zaalvoetbalclub uit.'],history:[],managerRep:62,popularity:65,board:65};
 clubs.forEach(function(c,i){var t=JSON.parse(JSON.stringify(c));t.id=i;t.p=0;t.w=0;t.d=0;t.l=0;t.gf=0;t.ga=0;t.pts=0;S.teams.push(t)});
 S.teams.forEach(function(t){fill(t.id,t.rep)});
 for(var i=0;i<18;i++)S.players.push(player(null,pick(pos),rnd(52,78)));
 buildSchedule();autoLineup();save();dashboard();
}
function reset(){if(confirm('Savegame wissen?')){safeDel();S=null;if(liveTimer)clearInterval(liveTimer);start()}}
function buildSchedule(){S.schedule=[];S.teams.forEach(function(t){t.p=t.w=t.d=t.l=t.gf=t.ga=t.pts=0});S.players.forEach(function(p){p.stats=newStats();p.injury=0;p.susp=0});var ids=S.teams.map(function(t){return t.id});var rounds=[];var arr=ids.slice();for(var r=0;r<arr.length-1;r++){var ms=[];for(var i=0;i<arr.length/2;i++){var a=arr[i],b=arr[arr.length-1-i];ms.push(r%2?{h:b,a:a}:{h:a,a:b})}rounds.push(ms);arr.splice(1,0,arr.pop())}rounds.concat(rounds.map(function(rd){return rd.map(function(m){return{h:m.a,a:m.h}})})).forEach(function(rd,i){rd.forEach(function(m){S.schedule.push({id:uid(),round:i+1,home:m.h,away:m.a,played:false,hg:null,ag:null})})})}
function nextMatch(){return S.schedule.filter(function(m){return !m.played&&(m.home===S.userTeamId||m.away===S.userTeamId)}).sort(function(a,b){return a.round-b.round})[0]||null}
function simBefore(){var n=nextMatch();var limit=n?n.round:999;S.schedule.filter(function(m){return !m.played&&m.round<=limit&&m.home!==S.userTeamId&&m.away!==S.userTeamId}).forEach(simAI)}
function available(id){return squad(id).filter(function(p){return p.injury<=0&&p.susp<=0})}
function bestLineup(id){var q=available(id);if(q.length<5)q=squad(id);var out=[];function take(position){var p=sorted(q.filter(function(x){return x.pos===position&&out.indexOf(x)<0}))[0];if(p)out.push(p)}take('Keeper');take('Verdediger');take('Flank');take('Flank');take('Pivot');sorted(q).forEach(function(p){if(out.length<5&&out.indexOf(p)<0)out.push(p)});return out.slice(0,5)}
function autoLineup(){S.lineup=bestLineup(S.userTeamId).map(function(p){return p.id})}
function lineup(id){if(id===S.userTeamId){var ids=S.lineup||[];var ps=ids.map(function(x){return S.players.find(function(p){return p.id===x})}).filter(Boolean);if(ps.length===5)return ps}return bestLineup(id)}
function strength(id){var q=lineup(id),s=0;q.forEach(function(p){s+=rating(p)});return q.length?s/q.length:45}
function goalCount(lam){lam=clamp(lam,.4,6);var L=Math.exp(-lam),k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1}
function scorer(id){var q=lineup(id).filter(function(p){return p.pos!=='Keeper'});var bag=[];q.forEach(function(p){var w=Math.max(1,Math.round(p.att/12));if(p.pos==='Pivot')w+=3;if(p.pos==='Flank')w+=2;for(var i=0;i<w;i++)bag.push(p)});return pick(bag.length?bag:q)}
function assist(id,sid){var q=lineup(id).filter(function(p){return p.pos!=='Keeper'&&p.id!==sid});return q.length&&Math.random()<.72?pick(q):null}
function apps(m){lineup(m.home).concat(lineup(m.away)).forEach(function(p){p.stats.apps++})}
function registerGoal(id){var s=scorer(id),a=assist(id,s.id);s.stats.goals++;if(a)a.stats.assists++;return {s:s,a:a}}
function apply(m){var h=teamBy(m.home),a=teamBy(m.away);h.p++;a.p++;h.gf+=m.hg;h.ga+=m.ag;a.gf+=m.ag;a.ga+=m.hg;if(m.hg>m.ag){h.w++;a.l++;h.pts+=3}else if(m.hg<m.ag){a.w++;h.l++;a.pts+=3}else{h.d++;a.d++;h.pts++;a.pts++}morale(m.home,m.hg,m.ag);morale(m.away,m.ag,m.hg)}
function morale(id,gf,ga){var d=gf>ga?rnd(1,4):gf===ga?rnd(-1,2):rnd(-4,-1);squad(id).forEach(function(p){p.mor=clamp(p.mor+d,20,99);p.sta=clamp(p.sta-rnd(1,3),25,99)})}
function simAI(m){apps(m);var hs=strength(m.home)+2,as=strength(m.away);m.hg=goalCount(2.6+(hs-as)/18);m.ag=goalCount(2.4+(as-hs)/18);for(var i=0;i<m.hg;i++)registerGoal(m.home);for(var j=0;j<m.ag;j++)registerGoal(m.away);m.played=true;apply(m)}
function complete(m,hg,ag){m.hg=hg;m.ag=ag;m.played=true;apply(m);var home=m.home===S.userTeamId;var ug=home?hg:ag,og=home?ag:hg;var t=team();var tickets=0;if(home){var att=clamp(Math.round(t.fans*(1.25-((S.ticket-10)*.035))+rnd(-90,120)),200,3500);tickets=att*S.ticket;t.fans=clamp(t.fans+(ug>og?rnd(18,55):ug===og?rnd(-8,20):rnd(-45,-10)),300,4000)}t.budget+=tickets-wages();S.popularity=clamp(S.popularity+(ug>og?3:ug===og?0:-3),0,100);S.board=clamp(S.board+(ug>og?2:ug===og?0:-2),0,100);S.inbox.unshift('Laatste match: '+teamBy(m.home).name+' '+hg+' - '+ag+' '+teamBy(m.away).name+'. Tickets '+money(tickets)+', lonen '+money(wages())+'.');squad(S.userTeamId).forEach(function(p){if(p.injury>0)p.injury--;if(p.susp>0)p.susp--});save()}
function table(){return S.teams.slice().sort(function(a,b){return b.pts-a.pts||((b.gf-b.ga)-(a.gf-a.ga))||b.gf-a.gf})}
function posUser(){return table().findIndex(function(t){return t.id===S.userTeamId})+1}
function shell(tab,content){by('nav').style.display=S?'grid':'none';['bHome','bMatch','bTeam','bTable','bMore'].forEach(function(id){by(id).classList.remove('active')});if(tab)by(tab).classList.add('active');if(S)by('topInfo').textContent=team().name+' - Seizoen '+S.season+' - Budget '+money(team().budget);by('app').innerHTML=content;save()}
function start(){by('nav').style.display='none';var has=!!safeGet();var html='<div class="start"><h1>De Zaalcoach</h1><p class="muted">Mobile first zaalvoetbalmanager</p>'+(has?'<div class="actions"><button class="success" id="continueBtn">Verder spelen</button><button class="danger" id="wipeBtn">Save wissen</button></div>':'')+'</div><div class="card"><h2>Nieuwe carrière</h2>'+clubs.map(function(c,i){return '<div class="item club" style="--c:'+c.c1+'" data-club="'+i+'"><h3>'+c.name+'</h3><p><span class="dot" style="background:'+c.c1+'"></span> <span class="dot" style="background:'+c.c2+'"></span></p><p>Reputatie <b class="yellow">'+c.rep+'</b> - Budget <b class="green">'+money(c.budget)+'</b></p></div>'}).join('')+'</div>';by('app').innerHTML=html;document.querySelectorAll('[data-club]').forEach(function(el){el.onclick=function(){newGame(Number(el.getAttribute('data-club')))}});var c=by('continueBtn');if(c)c.onclick=function(){if(load())dashboard();else start()};var w=by('wipeBtn');if(w)w.onclick=reset}
function dashboard(){simBefore();var m=nextMatch();var c='<div class="grid2"><div class="stat"><div class="label">Budget</div><div class="value green">'+money(team().budget)+'</div></div><div class="stat"><div class="label">Positie</div><div class="value yellow">'+posUser()+'e</div></div><div class="stat"><div class="label">Bestuur</div><div class="value">'+S.board+'%</div></div><div class="stat"><div class="label">Fans</div><div class="value blue">'+team().fans+'</div></div></div><div class="card"><h2>Dashboard</h2><p><strong>Volgende match</strong><br>'+(m?'Speeldag '+m.round+': '+teamBy(m.home).name+' - '+teamBy(m.away).name:'Geen matchen meer')+'</p><p class="muted">Gemiddelde ploegsterkte: '+avg(S.userTeamId)+' - Lonen per match: '+money(wages())+'</p><div class="actions">'+(m?'<button class="primary" id="goMatch">Matchcenter</button>':'<button class="success" id="seasonEnd">Seizoen afsluiten</button>')+'<button id="goTeam">Team</button></div></div><div class="card"><h3>Inbox</h3><p class="muted">'+(S.inbox[0]||'Geen berichten')+'</p></div>';shell('bHome',c);if(by('goMatch'))by('goMatch').onclick=matchCenter;if(by('seasonEnd'))by('seasonEnd').onclick=seasonEnd;if(by('goTeam'))by('goTeam').onclick=teamScreen}
function matchCenter(){simBefore();var m=nextMatch();if(!m){seasonEnd();return}var h=teamBy(m.home),a=teamBy(m.away);var c='<div class="card"><h2>Speeldag '+m.round+'</h2><div class="scorebox"><div class="team"><strong style="color:'+h.c1+'">'+h.name+'</strong><p class="muted">Rat '+avg(h.id)+'</p></div><div><div class="score" id="score">0 - 0</div><p class="muted" id="min" style="text-align:center">Voor aftrap</p></div><div class="team"><strong style="color:'+a.c1+'">'+a.name+'</strong><p class="muted">Rat '+avg(a.id)+'</p></div></div></div><div class="card"><p>Tactiek</p><select id="tac"><option>Voorzichtig</option><option selected>Gebalanceerd</option><option>Hoog druk zetten</option><option>Counteren</option><option>Balbezit</option><option>Alles-of-niets</option></select><div class="actions"><button class="success" id="startMatch">Start match</button><button class="warning" id="skipMatch">Skip</button></div></div><div class="log" id="log"></div>';shell('bMatch',c);by('tac').value=S.tactic;by('tac').onchange=function(){S.tactic=this.value;save()};by('startMatch').onclick=function(){playLive(m)};by('skipMatch').onclick=function(){skipMatch(m)}}
function addLog(txt,goal){var d=document.createElement('div');d.className='line'+(goal?' goal':'');d.textContent=txt;by('log').appendChild(d);by('log').scrollTop=by('log').scrollHeight}
function playLive(m){if(liveTimer)return;by('startMatch').disabled=true;by('skipMatch').disabled=true;apps(m);var min=0,hg=0,ag=0;addLog('Aftrap: '+teamBy(m.home).name+' tegen '+teamBy(m.away).name+'.');liveTimer=setInterval(function(){min+=rnd(2,4);if(min>40)min=40;var hs=strength(m.home)+(m.home===S.userTeamId&&S.tactic==='Hoog druk zetten'?3:0)+2,as=strength(m.away)+(m.away===S.userTeamId&&S.tactic==='Hoog druk zetten'?3:0);var att=Math.random()<hs/(hs+as)?m.home:m.away;var chance=.17+(strength(att)-strength(att===m.home?m.away:m.home))*.006;if(Math.random()<chance){var g=registerGoal(att);if(att===m.home)hg++;else ag++;addLog(min+'\' GOOOAL! '+g.s.name+' scoort voor '+teamBy(att).name+(g.a?' na assist van '+g.a.name:''),true)}else{addLog(min+'\' '+teamBy(att).name+' komt opzetten, maar geen goal.')}by('score').textContent=hg+' - '+ag;by('min').textContent='Minuut '+min;if(min>=40){clearInterval(liveTimer);liveTimer=null;complete(m,hg,ag);addLog('Eindsignaal. Eindstand '+hg+' - '+ag+'.');var wrap=document.createElement('div');wrap.className='actions';wrap.innerHTML='<button class="primary" id="afterTable">Stand</button><button id="afterHome">Home</button>';by('log').parentNode.appendChild(wrap);by('afterTable').onclick=tableScreen;by('afterHome').onclick=dashboard}},850)}
function skipMatch(m){apps(m);var hs=strength(m.home)+2,as=strength(m.away);var hg=goalCount(2.6+(hs-as)/18),ag=goalCount(2.4+(as-hs)/18);for(var i=0;i<hg;i++)registerGoal(m.home);for(var j=0;j<ag;j++)registerGoal(m.away);complete(m,hg,ag);shell('bMatch','<div class="card"><h2>Wedstrijd afgelopen</h2><p>'+teamBy(m.home).name+' - '+teamBy(m.away).name+'</p><h2>'+hg+' - '+ag+'</h2><div class="actions"><button class="primary" id="st">Stand</button><button id="hm">Home</button></div></div>');by('st').onclick=tableScreen;by('hm').onclick=dashboard}
function teamScreen(){var c='<div class="card"><h2>Selectie</h2><div class="actions"><button id="auto">Auto-opstelling</button><button id="transfers">Transfers</button></div></div>'+sorted(squad(S.userTeamId)).map(function(p){return '<div class="item"><h3>'+p.name+'</h3><p>'+p.pos+' - Rating <b>'+rating(p)+'</b> - '+p.age+' jaar</p><p>Conditie '+p.sta+' - Moraal '+p.mor+'</p><p>Waarde '+money(p.value)+' - Loon '+money(p.wage)+'</p><button class="danger small" data-sell="'+p.id+'">Verkopen</button></div>'}).join('');shell('bTeam',c);by('auto').onclick=function(){autoLineup();save();teamScreen()};by('transfers').onclick=transferScreen;document.querySelectorAll('[data-sell]').forEach(function(el){el.onclick=function(){sell(el.getAttribute('data-sell'))}})}
function transferScreen(){var c='<div class="card"><h2>Transfermarkt</h2><p class="muted">Budget '+money(team().budget)+'</p></div>'+sorted(freePlayers()).map(function(p){return '<div class="item"><h3>'+p.name+'</h3><p>'+p.pos+' - Rating '+rating(p)+' - '+p.age+' jaar</p><p>Prijs '+money(Math.round(p.value*1.08))+' - Loon '+money(p.wage)+'</p><button class="success small" data-buy="'+p.id+'">Kopen</button></div>'}).join('');shell('bTeam',c);document.querySelectorAll('[data-buy]').forEach(function(el){el.onclick=function(){buy(el.getAttribute('data-buy'))}})}
function buy(id){var p=S.players.find(function(x){return x.id===id}),price=Math.round(p.value*1.08);if(team().budget<price){alert('Onvoldoende budget');return}team().budget-=price;p.teamId=S.userTeamId;S.inbox.unshift(p.name+' gekocht voor '+money(price)+'.');autoLineup();save();transferScreen()}
function sell(id){if(squad(S.userTeamId).length<=6){alert('Minstens 6 spelers behouden.');return}var p=S.players.find(function(x){return x.id===id}),offer=Math.round(p.value*rnd(75,116)/100);if(confirm('Bod '+money(offer)+' voor '+p.name+'. Accepteren?')){team().budget+=offer;p.teamId=null;S.inbox.unshift(p.name+' verkocht voor '+money(offer)+'.');autoLineup();save();teamScreen()}}
function tableScreen(){var c='<div class="card"><h2>Stand</h2></div>'+table().map(function(t,i){return '<div class="item"><strong>'+(i+1)+'. '+t.name+'</strong><p>'+t.pts+' ptn - '+t.gf+'-'+t.ga+' - DS '+(t.gf-t.ga)+'</p><p class="muted">W '+t.w+' - G '+t.d+' - V '+t.l+'</p></div>'}).join('');shell('bTable',c)}
function moreScreen(){var c='<div class="card"><h2>Meer</h2><div class="grid2"><button id="finance">💰 Financiën</button><button id="inbox">✉️ Inbox</button><button id="train">🧪 Training</button><button id="wipe">🗑️ Save wissen</button></div></div>';shell('bMore',c);by('finance').onclick=financeScreen;by('inbox').onclick=function(){shell('bMore','<div class="card"><h2>Inbox</h2>'+S.inbox.map(function(x){return '<div class="item">'+x+'</div>'}).join('')+'</div>')};by('train').onclick=function(){if(team().budget<2200){alert('Onvoldoende budget');return}team().budget-=2200;squad(S.userTeamId).forEach(function(p){p.sta=clamp(p.sta+rnd(1,5),25,99);p.mor=clamp(p.mor+rnd(0,3),20,99)});S.inbox.unshift('Training afgerond.');save();dashboard()};by('wipe').onclick=reset}
function financeScreen(){var c='<div class="grid2"><div class="stat"><div class="label">Budget</div><div class="value green">'+money(team().budget)+'</div></div><div class="stat"><div class="label">Lonen</div><div class="value">'+money(wages())+'</div></div></div><div class="card"><h2>Financiën</h2><p>Ticketprijs</p><input id="ticket" type="number" min="5" max="45" value="'+S.ticket+'"><button class="success full" id="saveTicket">Opslaan</button></div>';shell('bMore',c);by('saveTicket').onclick=function(){var v=Number(by('ticket').value);if(v<5||v>45){alert('Tussen 5 en 45 euro.');return}S.ticket=v;save();financeScreen()}}
function seasonEnd(){S.schedule.filter(function(m){return !m.played}).forEach(simAI);var st=table(),champ=st[0],pos=posUser();S.history.push({season:S.season,champ:champ.name,pos:pos});S.managerRep=clamp(S.managerRep+(pos<=2?5:pos<=4?2:pos>=7?-4:1),35,95);var c='<div class="card"><h2>Seizoen '+S.season+' afgelopen</h2><p>Kampioen: <strong>'+champ.name+'</strong></p><p>Jouw positie: '+pos+'e</p><p>Managerreputatie: '+S.managerRep+'</p><button class="success full" id="newSeason">Nieuw seizoen starten</button></div>';shell('bMore',c);by('newSeason').onclick=function(){S.season++;buildSchedule();autoLineup();S.inbox.unshift('Nieuw seizoen gestart.');save();dashboard()}}
by('bHome').onclick=dashboard;by('bMatch').onclick=matchCenter;by('bTeam').onclick=teamScreen;by('bTable').onclick=tableScreen;by('bMore').onclick=moreScreen;
window.onerror=function(msg,url,line,col){by('app').innerHTML='<div class="card"><h2>Startfout</h2><p class="red">'+String(msg)+'</p><p class="muted">Regel '+line+'</p><button class="danger" onclick="localStorage.removeItem(\''+KEY+'\');location.reload()">Save wissen en herladen</button></div>';return false};
function boot(){try{if(load())dashboard();else start()}catch(e){by('app').innerHTML='<div class="card"><h2>Startfout</h2><p class="red">'+String(e&&e.message?e.message:e)+'</p><button class="danger" id="hardReset">Save wissen</button></div>';var b=by('hardReset');if(b)b.onclick=function(){safeDel();location.reload()}}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
</body>
</html>
