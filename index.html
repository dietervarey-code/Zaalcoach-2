(function(){'use strict';var KEY='zaalcoach_v5_upgrade_save',S=null,timer=null;function by(i){return document.getElementById(i)}function R(a,b){return Math.floor(Math.random()*(b-a+1))+a}function P(a){return a[Math.floor(Math.random()*a.length)]}function C(n,a,b){return Math.max(a,Math.min(b,n))}function M(n){return '€'+Math.round(n).toLocaleString('nl-BE')}function ID(){return 'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}function set(v){try{localStorage.setItem(KEY,v)}catch(e){}}function get(){try{return localStorage.getItem(KEY)}catch(e){return null}}function del(){try{localStorage.removeItem(KEY)}catch(e){}}function save(){if(S)set(JSON.stringify(S))}

function fixtures(ids){var a=ids.slice(),rounds=[];for(var r=0;r<a.length-1;r++){var ms=[];for(var i=0;i<a.length/2;i++)ms.push(r%2?{h:a[a.length-1-i],a:a[i]}:{h:a[i],a:a[a.length-1-i]});rounds.push(ms);a.splice(1,0,a.pop())}return rounds.concat(rounds.map(rd=>rd.map(m=>({h:m.a,a:m.h}))))}function buildSchedule(){S.schedule=[];S.teams.forEach(t=>{t.p=t.w=t.d=t.l=t.gf=t.ga=t.pts=0});S.players.forEach(p=>{p.stats=stats();p.injury=0;p.susp=0;p.yellow=0});fixtures(S.teams.map(t=>t.id)).forEach((rd,i)=>rd.forEach(m=>S.schedule.push({id:ID(),round:i+1,type:'league',home:m.h,away:m.a,played:false,hg:null,ag:null,att:null,ref:P(['Dieter Jannis','Stijn Lehembre','Koen Martens','Bert Smeets','Nicolas Peeters'])})));var ids=S.teams.map(t=>t.id).sort(()=>Math.random()-.5);for(var j=0;j<4;j++)S.schedule.push({id:ID(),round:3+j*2,type:'cup',home:ids[j*2],away:ids[j*2+1],played:false,hg:null,ag:null,att:null,ref:P(['Dieter Jannis','Stijn Lehembre','Koen Martens'])});S.schedule.sort((a,b)=>a.round-b.round)}function nextMatchNo(){return S.schedule.filter(m=>!m.played&&(m.home===S.userTeamId||m.away===S.userTeamId)).sort((a,b)=>a.round-b.round)[0]||null}function nextMatch(){simBefore();return nextMatchNo()}function simBefore(){var n=nextMatchNo(),lim=n?n.round:999;S.schedule.filter(m=>!m.played&&m.round<=lim&&m.home!==S.userTeamId&&m.away!==S.userTeamId).forEach(simAI)}function table(){return S.teams.slice().sort((a,b)=>b.pts-a.pts||((b.gf-b.ga)-(a.gf-a.ga))||b.gf-a.gf)}function posUser(){return table().findIndex(t=>t.id===S.userTeamId)+1}
function available(id){return squad(id).filter(p=>p.injury<1&&p.susp<1)}function bestLineup(id){var q=available(id);if(q.length<5)q=squad(id);var one=x=>sorted(q.filter(p=>p.pos===x))[0],l=[one('Keeper'),one('Verdediger')].filter(Boolean).concat(sorted(q.filter(p=>p.pos==='Flank')).slice(0,2),[one('Pivot')]).filter(Boolean),used=l.map(p=>p.id),rem=sorted(q.filter(p=>used.indexOf(p.id)<0));while(l.length<5&&rem.length)l.push(rem.shift());return l}function autoLineup(){var l=bestLineup(S.userTeamId);S.lineup={gk:l[0]?.id||'',def:l[1]?.id||'',fl1:l[2]?.id||'',fl2:l[3]?.id||'',piv:l[4]?.id||''}}function lineup(id){if(id!==S.userTeamId)return bestLineup(id);var ids=Object.values(S.lineup).filter(Boolean),ps=ids.map(id=>S.players.find(p=>p.id===id)).filter(Boolean);if(ps.length<5||new Set(ids).size<5||ps.some(p=>p.injury>0||p.susp>0))return bestLineup(id);return ps}function strength(id){var l=lineup(id);if(!l.length)return 40;var a=0,d=0,t=0,st=0,m=0;l.forEach(p=>{a+=p.att;d+=p.def;t+=p.tech;st+=p.sta;m+=p.mor});var s=(a*.29+d*.25+t*.24+st*.12+m*.10)/l.length;if(id===S.userTeamId)s+=staff('assistant')/18;if(id===S.userTeamId&&S.tactic==='Hoog druk zetten')s+=2;if(id===S.userTeamId&&S.tactic==='Balbezit')s+=1.5;if(id===S.userTeamId&&S.tactic==='Voorzichtig')s-=1;return Math.round(s)}function goalCount(l){l=C(l,.4,6.3);var L=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1}function scorer(id){var l=lineup(id).filter(p=>p.pos!=='Keeper'),bag=[];l.forEach(p=>{var w=Math.max(1,Math.round(p.att/12));if(p.pos==='Pivot')w+=3;if(p.pos==='Flank')w+=2;for(var i=0;i<w;i++)bag.push(p)});return P(bag.length?bag:l)}function assist(id,sid){var l=lineup(id).filter(p=>p.pos!=='Keeper'&&p.id!==sid);return l.length&&Math.random()<.75?P(l):null}function apps(m){[m.home,m.away].forEach(id=>lineup(id).forEach(p=>p.stats.apps++))}function regGoal(type,id){var s=scorer(id),a=assist(id,s.id);s.stats.goals++;if(a)a.stats.assists++;return{s:s,a:a}}

function shell(tab,content){by('nav').style.display=S?'grid':'none';['bHome','bMatch','bCal','bTeam','bMore'].forEach(i=>by(i).classList.remove('active'));if(tab)by(tab).classList.add('active');by('topInfo').textContent=S?team().name+' · Seizoen '+S.season+' · Budget '+M(team().budget):'CM03-geinspireerde zaalvoetbalcarriere voor mobiel';by('app').innerHTML=content;save()}function start(){var has=!!get();shell(null,'<div class="start"><h1>De Zaalcoach</h1><p class="muted">V5 Mobile · charmante carriereversie</p>'+(has?'<div class="actions"><button class="success" id="continueBtn">Verder spelen</button><button class="danger" id="wipeBtn">Save wissen</button></div>':'')+'</div><div class="card"><h2>Nieuwe carriere</h2>'+clubs.map((c,i)=>'<div class="item club" style="--c:'+c.c1+'" data-club="'+i+'"><h3>'+c.name+'</h3><p><span class="dot" style="background:'+c.c1+'"></span> <span class="dot" style="background:'+c.c2+'"></span></p><p>Reputatie <b class="yellow">'+c.rep+'</b> · Budget <b class="green">'+M(c.budget)+'</b></p></div>').join('')+'</div>');document.querySelectorAll('[data-club]').forEach(el=>el.onclick=()=>newGame(Number(el.dataset.club)));if(by('continueBtn'))by('continueBtn').onclick=()=>{if(load())dashboard();else start()};if(by('wipeBtn'))by('wipeBtn').onclick=reset}
function kitHtml(t){return '<div class="kit '+t.pat+'" style="--p:'+t.c1+';--s:'+t.c2+'"></div>'}function dashboard(){var m=nextMatch();var c='<div class="card kitwrap">'+kitHtml(team())+'<div><span class="pill"><span class="dot" style="background:'+team().c1+'"></span>'+team().name+'</span><p class="muted">Managerrep '+S.manager.rep+' · positie '+posUser()+'e · ploeg '+avg(S.userTeamId)+'</p></div></div><div class="grid2"><div class="stat"><div class="label">Budget</div><div class="value green">'+M(team().budget)+'</div></div><div class="stat"><div class="label">Bestuur</div><div class="value yellow">'+S.board+'%</div></div><div class="stat"><div class="label">Populariteit</div><div class="value blue">'+S.popularity+'%</div></div><div class="stat"><div class="label">Lonen/match</div><div class="value">'+M(wages())+'</div></div></div><div class="card"><h2>Dashboard</h2><p><strong>Volgende match</strong><br>'+(m?'Speeldag '+m.round+' · '+(m.type==='cup'?'Beker':'Competitie')+': '+teamBy(m.home).name+' - '+teamBy(m.away).name:'Geen matchen meer')+'</p><p class="muted">Bestuur: '+(posUser()<=4?'De top vier is haalbaar. Hou de kleedkamer scherp.':'Het bestuur wil snel punten zien.')+'</p><div class="actions">'+(m?'<button class="primary" id="goMatch">Matchcenter</button>':'<button class="success" id="seasonEnd">Seizoen afsluiten</button>')+'<button id="goCal">Kalender</button></div></div><div class="card"><h3>Laatste bericht</h3><p class="muted">'+(S.inbox[0]||'Geen berichten')+'</p></div>';shell('bHome',c);if(by('goMatch'))by('goMatch').onclick=matchCenter;if(by('seasonEnd'))by('seasonEnd').onclick=seasonEnd;if(by('goCal'))by('goCal').onclick=calendar}
function matchCenter(){var m=nextMatch();if(!m){seasonEnd();return}var h=teamBy(m.home),a=teamBy(m.away);shell('bMatch','<div class="card"><h2>'+((m.type==='cup')?'Beker':'Competitie')+' · speeldag '+m.round+'</h2><div class="scorebox"><div class="team"><strong style="color:'+h.c1+'">'+h.name+'</strong><p class="muted">Rat '+avg(h.id)+'</p></div><div><div class="score" id="score">0 - 0</div><p class="muted" id="min" style="text-align:center">Voor aftrap</p></div><div class="team"><strong style="color:'+a.c1+'">'+a.name+'</strong><p class="muted">Rat '+avg(a.id)+'</p></div></div></div><div class="card"><p>Tactiek</p><select id="tac">'+tactics.map(t=>'<option '+(t===S.tactic?'selected':'')+'>'+t+'</option>').join('')+'</select><div class="actions"><button class="success" id="startMatch">Start match</button><button class="warning" id="skipMatch">Skip</button></div></div><div class="log" id="log"></div>');by('tac').onchange=function(){S.tactic=this.value;save();log('Coach wijzigt naar '+this.value+'.')};by('startMatch').onclick=()=>play(m);by('skipMatch').onclick=()=>skip(m)}function log(txt,cls){var d=document.createElement('div');d.className='line '+(cls||'');d.textContent=txt;by('log').appendChild(d);by('log').scrollTop=by('log').scrollHeight}function play(m){if(timer)return;by('startMatch').disabled=true;by('skipMatch').disabled=true;apps(m);var min=0,hg=0,ag=0;log('Aftrap. '+teamBy(m.home).name+' tegen '+teamBy(m.away).name+'. Scheidsrechter: '+m.ref+'.');timer=setInterval(function(){min+=R(1,3);if(min>40)min=40;var hs=strength(m.home)+2,as=strength(m.away),att=Math.random()<hs/(hs+as)?m.home:m.away,def=att===m.home?m.away:m.home,ch=C(.15+(strength(att)-strength(def))*.007+(S.tactic==='Alles-of-niets'&&att===S.userTeamId?.06:0),.05,.35);if(Math.random()<ch){var g=regGoal(m.type,att);if(att===m.home)hg++;else ag++;log(min+'\' GOOOOAL! '+g.s.name+' scoort voor '+teamBy(att).name+(g.a?' op aangeven van '+g.a.name:'')+'!','goal')}else if(Math.random()<.18){var p=P(lineup(att));p.yellow++;log(min+'\' stevige tackle van '+p.name+'. Geel had gekund.','cardline')}else if(Math.random()<.10){var q=P(lineup(att));var risk=.13+(q.sta<45?.12:0)-staff('physio')/450;if(Math.random()<risk){q.injury=R(1,4);log(min+'\' Blessure voor '+q.name+'. Hij is '+q.injury+' match(es) out.','injury')}else log(min+'\' '+q.name+' blijft even liggen, maar kan verder.','injury')}else log(min+'\' '+P(['Knappe combinatie','Hoge druk','Snelle omschakeling','Slimme loopactie','Bal tegen de boarding'])+' bij '+teamBy(att).name+'.');by('score').textContent=hg+' - '+ag;by('min').textContent='Minuut '+min;if(min>=40){clearInterval(timer);timer=null;if(m.type==='cup'&&hg===ag)(Math.random()<.5?hg++:ag++);complete(m,hg,ag,true);log('Eindsignaal. Eindstand '+hg+' - '+ag+'.');var w=document.createElement('div');w.className='actions';w.innerHTML='<button class="primary" id="aftStand">Stand</button><button id="aftHome">Home</button>';by('log').parentNode.appendChild(w);by('aftStand').onclick=competitions;by('aftHome').onclick=dashboard}},850)}function skip(m){apps(m);var hg=goalCount(2.7+(strength(m.home)-strength(m.away))/18),ag=goalCount(2.5+(strength(m.away)-strength(m.home))/18);if(m.type==='cup'&&hg===ag)(Math.random()<.5?hg++:ag++);for(var i=0;i<hg;i++)regGoal(m.type,m.home);for(var j=0;j<ag;j++)regGoal(m.type,m.away);complete(m,hg,ag,true);shell('bMatch','<div class="card"><h2>Wedstrijd afgelopen</h2><p>'+teamBy(m.home).name+' - '+teamBy(m.away).name+'</p><h2>'+hg+' - '+ag+'</h2><p class="muted">Toeschouwers: '+m.att+'</p><div class="actions"><button class="primary" id="st">Stand</button><button id="hm">Home</button></div></div>');by('st').onclick=competitions;by('hm').onclick=dashboard}
function calendar(){shell('bCal','<div class="card"><h2>Speelkalender</h2><p class="muted">Competitie en beker in een mobiel overzicht.</p></div>'+S.schedule.sort((a,b)=>a.round-b.round).map(m=>'<div class="item"><strong>Speeldag '+m.round+' · '+(m.type==='cup'?'Beker':'Competitie')+'</strong><p>'+teamBy(m.home).name+' - '+teamBy(m.away).name+'</p><p class="muted">Ref: '+m.ref+' · '+(m.played?'Uitslag '+m.hg+'-'+m.ag+' · '+m.att+' fans':'Nog te spelen')+'</p></div>').join(''))}
function teamScreen(){var ps=sorted(squad(S.userTeamId));shell('bTeam','<div class="card"><h2>Selectie</h2><div class="actions"><button id="lineupBtn">Opstelling</button><button id="transferBtn">Transfers</button><button id="trainBtn">Training</button></div></div>'+ps.map(p=>'<div class="item"><h3>'+p.name+'</h3><p>'+p.pos+' · rating <b>'+rating(p)+'</b> · '+p.age+' jaar</p><p>ATT '+p.att+' · DEF '+p.def+' · TEC '+p.tech+' · CON '+p.sta+' · MOR '+p.mor+'</p><p class="'+(p.injury>0||p.susp>0?'red':'green')+'">'+(p.injury>0?'Blessure '+p.injury+' match(es)':p.susp>0?'Geschorst':'Fit')+'</p><p>Waarde '+M(p.value)+' · Loon '+M(p.wage)+'</p><button class="danger small" data-sell="'+p.id+'">Verkopen</button></div>').join(''));by('lineupBtn').onclick=lineupScreen;by('transferBtn').onclick=transfers;by('trainBtn').onclick=training;document.querySelectorAll('[data-sell]').forEach(e=>e.onclick=()=>sell(e.dataset.sell))}function lineupScreen(){var q=available(S.userTeamId);if(q.length<5)q=squad(S.userTeamId);function opts(sel){return sorted(q).map(p=>'<option value="'+p.id+'" '+(p.id===sel?'selected':'')+'>'+p.name+' · '+p.pos+' · '+rating(p)+'</option>').join('')}shell('bTeam','<div class="card"><h2>Opstelling</h2>'+[['gk','Keeper'],['def','Verdediger'],['fl1','Flank'],['fl2','Flank'],['piv','Pivot']].map(x=>'<p>'+x[1]+'</p><select id="'+x[0]+'">'+opts(S.lineup[x[0]])+'</select>').join('')+'<p>Tactiek</p><select id="tactic">'+tactics.map(t=>'<option '+(t===S.tactic?'selected':'')+'>'+t+'</option>').join('')+'</select><div class="actions"><button class="success" id="saveLine">Opslaan</button><button id="autoLine">Auto</button></div></div>');by('saveLine').onclick=()=>{var ids=['gk','def','fl1','fl2','piv'].map(i=>by(i).value);if(new Set(ids).size<5){alert('Kies vijf unieke spelers.');return}S.lineup={gk:ids[0],def:ids[1],fl1:ids[2],fl2:ids[3],piv:ids[4]};S.tactic=by('tactic').value;save();dashboard()};by('autoLine').onclick=()=>{autoLineup();save();lineupScreen()}}
function transfers(){var max=staff('scout')?30:16;shell('bTeam','<div class="card"><h2>Transfermarkt</h2><p class="muted">Budget '+M(team().budget)+' · Scoutniveau '+staff('scout')+'</p></div>'+sorted(free()).slice(0,max).map(p=>'<div class="item"><h3>'+p.name+'</h3><p>'+p.pos+' · rating '+rating(p)+' · '+p.age+' jaar</p><p>Prijs '+M(Math.round(p.value*1.08))+' · Loon '+M(p.wage)+'</p><button class="success small" data-buy="'+p.id+'">Kopen</button></div>').join(''));document.querySelectorAll('[data-buy]').forEach(e=>e.onclick=()=>buy(e.dataset.buy))}function buy(id){var p=S.players.find(x=>x.id===id),price=Math.round(p.value*1.08);if(team().budget<price){alert('Onvoldoende budget.');return}team().budget-=price;p.teamId=S.userTeamId;S.inbox.unshift(p.name+' gekocht voor '+M(price)+'.');autoLineup();save();transfers()}function sell(id){if(squad(S.userTeamId).length<=6){alert('Minstens 6 spelers behouden.');return}var p=S.players.find(x=>x.id===id),offer=Math.round(p.value*R(75,116)/100);if(confirm('Bod '+M(offer)+' voor '+p.name+'. Accepteren?')){team().budget+=offer;p.teamId=null;S.inbox.unshift(p.name+' verkocht voor '+M(offer)+'.');autoLineup();save();teamScreen()}}
function training(){shell('bTeam','<div class="card"><h2>Training</h2><p class="muted">Kies gericht. Elke training kost geld, maar bouwt selectie-identiteit.</p></div>'+trainings.map((tr,i)=>'<div class="item"><h3>'+tr+'</h3><p class="muted">Kost '+M(1400+i*450)+' · effect op selectie.</p><button class="success small" data-train="'+i+'">Start training</button></div>').join(''));document.querySelectorAll('[data-train]').forEach(e=>e.onclick=()=>doTrain(Number(e.dataset.train)))}function doTrain(i){var cost=1400+i*450;if(team().budget<cost){alert('Onvoldoende budget.');return}team().budget-=cost;squad(S.userTeamId).forEach(p=>{if(i===0)p.sta=C(p.sta+R(2,6)+Math.round(staff('fitness')/30),25,99);if(i===1)p.att=C(p.att+R(1,4),25,99);if(i===2)p.def=C(p.def+R(1,4),25,99);if(i===3)p.tech=C(p.tech+R(1,4),25,99);if(i===4)p.mor=C(p.mor+R(3,7),20,99)});S.inbox.unshift(trainings[i]+' afgerond.');save();teamScreen()}
function more(){shell('bMore','<div class="card"><h2>Meer</h2><div class="grid2"><button id="finance">💰 Financien</button><button id="staff">👔 Staff</button><button id="kit">🎽 Shirt</button><button id="stats">📊 Stats</button><button id="comp">🏟️ Stand</button><button id="hist">📜 Historiek</button><button id="inbox">✉️ Inbox</button><button class="danger" id="wipe">🗑️ Save</button></div></div>');by('finance').onclick=finance;by('staff').onclick=staffScreen;by('kit').onclick=kitScreen;by('stats').onclick=statsScreen;by('comp').onclick=competitions;by('hist').onclick=history;by('inbox').onclick=()=>shell('bMore','<div class="card"><h2>Inbox</h2>'+S.inbox.map(x=>'<div class="item">'+x+'</div>').join('')+'</div>');by('wipe').onclick=reset}function finance(){shell('bMore','<div class="grid2"><div class="stat"><div class="label">Budget</div><div class="value green">'+M(team().budget)+'</div></div><div class="stat"><div class="label">Fans</div><div class="value blue">'+team().fans+'</div></div></div><div class="card"><h2>Financien</h2><p>Ticketprijs</p><input type="number" id="ticket" min="5" max="45" value="'+S.ticket+'"><button class="success full" id="saveTicket">Opslaan</button></div>'+(S.sponsor?'<div class="card"><h3>Sponsor</h3><p>'+S.sponsor.name+'</p><p>Vast '+M(S.sponsor.base)+' · winstbonus '+M(S.sponsor.bonus)+' · '+S.sponsor.dur+' matchen</p></div>':'<div class="card"><h3>Sponsordeals</h3>'+S.sponsorOffers.map(o=>'<div class="item"><strong>'+o.name+'</strong><p>Vast '+M(o.base)+' · bonus '+M(o.bonus)+' · '+o.dur+' matchen</p><button class="success small" data-sponsor="'+o.id+'">Accepteren</button> <button class="warning small" data-neg="'+o.id+'">Onderhandel</button></div>').join('')+'</div>'));by('saveTicket').onclick=()=>{var v=Number(by('ticket').value);if(v<5||v>45){alert('Tussen 5 en 45 euro.');return}S.ticket=v;save();finance()};document.querySelectorAll('[data-sponsor]').forEach(e=>e.onclick=()=>{S.sponsor=Object.assign({},S.sponsorOffers.find(o=>o.id===e.dataset.sponsor));S.sponsorOffers=[];save();finance()});document.querySelectorAll('[data-neg]').forEach(e=>e.onclick=()=>{var o=S.sponsorOffers.find(x=>x.id===e.dataset.neg),ch=.42+staff('commercial')/180;if(Math.random()<ch){o.base=Math.round(o.base*1.15);o.bonus=Math.round(o.bonus*1.15);S.inbox.unshift('Sponsoronderhandeling geslaagd.')}else{S.sponsorOffers=S.sponsorOffers.filter(x=>x.id!==o.id);S.inbox.unshift('Sponsor haakt af na harde onderhandeling.')}save();finance()})}
function staffScreen(){if(!S.staffPool)S.staffPool=staffPool();shell('bMore','<div class="card"><h2>Staff</h2>'+staffRoles.map(r=>{var s=S.staff[r[0]];return '<div class="item"><strong>'+r[1]+'</strong><p>'+(s?s.name+' · niveau '+s.rating:'Vacant')+'</p><p class="muted">'+r[2]+'</p></div>'}).join('')+'</div><div class="card"><h3>Beschikbaar</h3>'+S.staffPool.map(s=>'<div class="item"><strong>'+s.name+'</strong><p>'+s.role+' · niveau '+s.rating+'</p><p class="muted">'+s.desc+'</p><p>Tekengeld '+M(s.fee)+' · loon '+M(s.wage)+'</p><button class="success small" data-hire="'+s.id+'">Aannemen</button></div>').join('')+'</div>');document.querySelectorAll('[data-hire]').forEach(e=>e.onclick=()=>{var s=S.staffPool.find(x=>x.id===e.dataset.hire);if(team().budget<s.fee){alert('Onvoldoende budget.');return}team().budget-=s.fee;S.staff[s.key]=s;S.staffPool=S.staffPool.filter(x=>x.id!==s.id);S.inbox.unshift(s.name+' aangesteld als '+s.role+'.');save();staffScreen()})}function kitScreen(){shell('bMore','<div class="card"><h2>Shirtstijl</h2><div class="kitwrap">'+kitHtml(team())+'<div><strong>'+team().name+'</strong><p class="muted">Maak je club herkenbaar.</p></div></div><p>Hoofdkleur</p><input type="color" id="c1" value="'+team().c1+'"><p>Tweede kleur</p><input type="color" id="c2" value="'+team().c2+'"><p>Patroon</p><select id="pat">'+['plain','vertical','horizontal','sash'].map(p=>'<option '+(p===team().pat?'selected':'')+'>'+p+'</option>').join('')+'</select><button class="success full" id="saveKit">Opslaan</button></div>');by('saveKit').onclick=()=>{team().c1=by('c1').value;team().c2=by('c2').value;team().pat=by('pat').value;save();kitScreen()}}function statsScreen(){var tops=sorted(S.players.filter(p=>p.stats.goals>0)).sort((a,b)=>b.stats.goals-a.stats.goals).slice(0,12);shell('bMore','<div class="card"><h2>Statistieken</h2></div>'+(tops.map((p,i)=>'<div class="item"><strong>'+(i+1)+'. '+p.name+'</strong><p>'+(teamBy(p.teamId)?.name||'Vrij')+' · '+p.stats.goals+' goals · '+p.stats.assists+' assists</p></div>').join('')||'<div class="item muted">Nog geen goals.</div>'))}function competitions(){shell('bMore','<div class="card"><h2>Stand</h2></div>'+table().map((t,i)=>'<div class="item"><strong>'+(i+1)+'. '+t.name+'</strong><p>'+t.pts+' ptn · '+t.gf+'-'+t.ga+' · DS '+(t.gf-t.ga)+'</p><p class="muted">W '+t.w+' · G '+t.d+' · V '+t.l+'</p></div>').join(''))}function history(){shell('bMore','<div class="card"><h2>Historiek</h2>'+(S.history.map(h=>'<div class="item">Seizoen '+h.season+'<br>Kampioen: '+h.champ+'<br>Jouw positie: '+h.pos+'e</div>').join('')||'<p class="muted">Nog geen historie.</p>')+'</div>')}
function seasonEnd(){S.schedule.filter(m=>!m.played).forEach(simAI);var st=table(),champ=st[0],pos=posUser();champ.trophies.push('Kampioen seizoen '+S.season);S.history.push({season:S.season,champ:champ.name,pos:pos});S.manager.rep=C(S.manager.rep+(pos<=2?6:pos<=4?3:pos>=7?-5:1),35,95);shell('bMore','<div class="card"><h2>Seizoen '+S.season+' afgelopen</h2><p>Kampioen: <strong>'+champ.name+'</strong></p><p>Jouw positie: '+pos+'e</p><p>Managerreputatie: '+S.manager.rep+'</p><button class="success full" id="newSeason">Nieuw seizoen starten</button></div>');by('newSeason').onclick=()=>{S.season++;for(var i=0;i<8;i++)S.players.push(player(null,P(positions),R(53,80)));S.sponsorOffers=S.sponsor?S.sponsorOffers:sponsorOffers(team().rep);buildSchedule();autoLineup();S.inbox.unshift('Nieuw seizoen gestart. De voorbereiding begint nu.');save();dashboard()}}
by('bHome').onclick=dashboard;by('bMatch').onclick=matchCenter;by('bCal').onclick=calendar;by('bTeam').onclick=teamScreen;by('bMore').onclick=more;window.onerror=function(msg,url,line){by('app').innerHTML='<div class="card"><h2>Startfout</h2><p class="red">'+String(msg)+'</p><p class="muted">Regel '+line+'</p><button class="danger" onclick="localStorage.removeItem(\''+KEY+'\');location.reload()">Save wissen en herladen</button></div>';return false};function boot(){try{if(load())dashboard();else start()}catch(e){by('app').innerHTML='<div class="card"><h2>Startfout</h2><p class="red">'+String(e&&e.message?e.message:e)+'</p><button class="danger" id="hardReset">Save wissen</button></div>';if(by('hardReset'))by('hardReset').onclick=()=>{del();location.reload()}}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();})();
</script></body></html>
